name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.6
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12 --group dev
      - name: Audit tracked public files
        run: uv run --frozen python tools/check_public_tree.py
      - name: Lint
        run: uv run --frozen ruff check src tests tools examples/resource_allocation
      - name: Test including macOS sandbox integration
        run: uv run --frozen pytest -q
